apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../argocd/base
namePrefix: demo2-prod-prod-
patches:
  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        name: services
        namespace: argocd
      spec:
        template:
          metadata:
            name: demo2-prod-prod-{{ .name }}
          spec:
            destination:
              namespace: demo2-prod-prod
            source:
              helm:
                valueFiles:
                - ../../environments/demo2/prod/values/{{ .valuesFile }}
  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: common-concerns
        namespace: argocd
      spec:
        destination:
          namespace: demo2-prod-prod
        source:
          helm:
            valueFiles:
            - ../../environments/demo2/prod/values/common-concerns.yaml
  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: storybook
        namespace: argocd
      spec:
        destination:
          namespace: demo2-prod-prod
        source:
          helm:
            valueFiles:
            - ../../environments/demo2/prod/values/storybook.yaml
