apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - list:
      elements:
      - name: service
        releaseName: service
        valuesFile: service.yaml
  template:
    metadata:
      name: environment-{{ .name }}
    spec:
      project: default
      source:
        repoURL: https://github.com/VStefanov/gitops-example.git
        targetRevision: main
        path: charts/service
        helm:
          releaseName: '{{ .releaseName }}'
          valueFiles:
          - ../../ENVIRONMENT/STAGE/values/{{ .valuesFile }}
      destination:
        server: https://kubernetes.default.svc
        namespace: environment
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
