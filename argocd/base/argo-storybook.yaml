apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storybook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VStefanov/gitops-example.git
    targetRevision: main
    path: charts/storybook
    helm:
      releaseName: storybook
      valueFiles:
      - ../../ENVIRONMENT/STAGE/values/storybook.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: environment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
