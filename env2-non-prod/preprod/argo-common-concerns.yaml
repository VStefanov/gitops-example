apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env2-non-prod-preprod-common-concerns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VStefanov/gitops-example.git
    targetRevision: main
    path: charts/common-concerns
    helm:
      releaseName: common-concerns
      valueFiles:
        - ../../env2-non-prod/preprod/values/common-concerns.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: env2-non-prod-preprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
