apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env2-prod-qa-storybook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VStefanov/gitops-example.git
    targetRevision: main
    path: charts/storybook
    helm:
      releaseName: storybook
      valueFiles:
        - ../../env2-prod/qa/values/storybook.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: env2-prod-qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
